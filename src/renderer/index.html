<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-src 'none'">
  <title>QuadFinder</title>
  <link rel="stylesheet" href="styles.css">
  <script src="icons.js" defer></script>
  <script src="preview.js" defer></script>
  <script src="features.js" defer></script>
  <script src="renderer.js" defer></script>
</head>
<body>
  <header class="titlebar">
    <div class="brand"><span data-icon="folder-blue"></span><strong>QuadFinder</strong></div>
    <div class="window-controls"><button data-window="minimize" aria-label="최소화">─</button><button data-window="maximize" aria-label="최대화">□</button><button data-window="close" aria-label="닫기">×</button></div>
  </header>
  <main class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-heading"><span data-icon="desktop-small"></span>즐겨찾기 <span class="collapse-mark">⌃</span></div>
      <nav id="places" aria-label="즐겨찾기"></nav>
      <nav id="custom-places" aria-label="추가한 검색 폴더"></nav>
      <div class="sidebar-heading drives-heading"><span data-icon="desktop-small"></span>내 PC <span class="collapse-mark">⌃</span></div>
      <nav id="drives" aria-label="드라이브"></nav>
      <button id="choose-folder" class="add-location"><span data-icon="plus"></span>폴더 추가</button>
      <div id="sidebar-resizer" role="separator" tabindex="0" aria-label="탐색 영역 너비 조절" aria-orientation="vertical" aria-controls="sidebar" aria-valuemin="150" aria-valuemax="400" aria-valuenow="184" title="드래그하여 너비 조절 · 더블클릭으로 초기화 · 방향키로 조절"></div>
    </aside>
    <section class="workspace">
      <div class="search-toolbar">
        <label class="search-box"><span data-icon="search"></span><input id="search" aria-label="파일명 검색" placeholder="파일 이름으로 검색하세요" autocomplete="off" spellcheck="false"><kbd>Ctrl K</kbd><button id="clear-search" aria-label="검색어 지우기">×</button></label>
        <div id="filters" role="group" aria-label="검색 필터"><button data-filter="all" class="active">전체</button><button data-filter="documents">문서</button><button data-filter="images">이미지</button><button data-filter="recent" title="최근 7일 내 수정한 파일">최근 수정</button></div>
        <div class="layout-switch" role="group" aria-label="패널 배치"><button data-layout="1" title="1분할" aria-label="1분할"><span data-icon="layout1"></span>1</button><button data-layout="2" title="2분할" aria-label="2분할"><span data-icon="layout2"></span>2</button><button data-layout="4" class="active" title="4분할" aria-label="4분할"><span data-icon="layout4"></span>4</button></div>
      </div>
      <div id="panes" class="panes layout-4" aria-label="파일 탐색 패널"></div>
    </section>
  </main>
  <footer class="statusbar"><span class="status-dot"></span><span id="index-status">검색 준비 중</span><span class="status-divider"></span><span id="index-count">0개 파일</span><button id="reindex" title="검색 인덱스 새로고침" aria-label="검색 인덱스 새로고침"><span data-icon="refresh"></span></button><span id="status-message"></span><span class="status-right"><button id="zoom-reset" title="Ctrl+휠로 전체 크기 조절 · 클릭 또는 Ctrl+0으로 초기화" aria-label="전체 화면 배율 초기화">100%</button><button id="manage-roots" title="검색 폴더 관리"><span id="scope-label"></span></button><button id="show-operations">작업 <span id="job-count">0</span></button><span id="preview-label"></span></span></footer>
  <dialog id="folder-dialog"><form method="dialog"><h2>새 폴더 만들기</h2><p id="folder-parent"></p><label>폴더 이름<input id="folder-name" required maxlength="200" autocomplete="off"></label><div class="dialog-actions"><button value="cancel">취소</button><button id="create-folder" value="create" class="primary">만들기</button></div></form></dialog>
  <dialog id="rename-dialog"><form method="dialog"><h2>이름 변경</h2><p id="rename-path"></p><label>새 이름<input id="rename-name" required maxlength="240" autocomplete="off"></label><div class="dialog-actions"><button value="cancel" formnovalidate>취소</button><button value="rename" class="primary">변경</button></div></form></dialog>
  <dialog id="roots-dialog"><h2>검색 폴더</h2><p>아래 폴더와 하위 폴더의 파일 이름을 검색합니다.</p><div id="root-list"></div><div class="root-path-row"><input id="root-path" aria-label="추가할 검색 폴더 경로" placeholder="폴더 경로 입력 (예: C:\Projects)"><button id="add-root-path">경로 추가</button></div><div class="dialog-actions"><button id="add-root">폴더 선택</button><button id="close-roots" class="primary">닫기</button></div></dialog>
  <dialog id="properties-dialog"><h2>파일 정보</h2><div id="properties-content"></div><div class="dialog-actions"><button id="close-properties" class="primary">닫기</button></div></dialog>
  <aside id="operations-panel" hidden aria-label="파일 작업"><header><strong>파일 작업</strong><button id="clear-jobs">완료 항목 지우기</button><button id="close-jobs" aria-label="작업 창 닫기">×</button></header><div id="job-list"></div><p>취소하면 완료된 항목은 유지됩니다. 이동한 원본은 Windows 휴지통에서 복원할 수 있습니다.</p></aside>
  <div id="context-menu" role="menu" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
