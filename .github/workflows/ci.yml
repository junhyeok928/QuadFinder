name: Windows checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm smoke
      - run: pnpm package
      - uses: actions/upload-artifact@v4
        with:
          name: QuadFinder-windows-x64
          path: release/QuadFinder-win32-x64
